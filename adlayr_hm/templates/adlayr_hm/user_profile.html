<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile | AdLaYr's HealthMix</title>

    <!-- Bootstrap (optional but recommended) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
        }

        .profile-card {
            background: #121212;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.05);
        }

        .gold-text {
            color: #d4af37;
        }

        .divider {
            height: 1px;
            background: rgba(255, 215, 0, 0.2);
            margin: 20px 0;
        }

        .address-box {
            background: #181818;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
        }

        .btn-gold {
            background: #d4af37;
            color: #000;
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-gold:hover {
            background: #b8962e;
        }

        .btn-outline-gold {
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 10px;
        }

        .btn-outline-gold:hover {
            background: #d4af37;
            color: #000;
        }

        .page-wrapper {
            margin-top: 7%;
        }
    </style>
</head>
<body>

<div class="container py-5 page-wrapper">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- USER PROFILE CARD -->
            <div class="profile-card">

                <!-- USER INFO -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-1 gold-text">Welcome, Vignesh BR</h3>
                        <p class="mb-0 text-muted">br20062002@gmail.com</p>
                    </div>
                    <a href="#" class="btn btn-outline-gold btn-sm">
                        Edit Profile
                    </a>
                </div>

                <div class="divider"></div>

                <!-- ESSENTIAL DETAILS -->
                <div class="row">
                    <div class="col-md-6">
                        <p class="mb-1 text-muted">Phone</p>
                        <h6>+91 8220545256</h6>
                    </div>
                    <div class="col-md-6">
                        <p class="mb-1 text-muted">Member Since</p>
                        <h6>20/12/2025</h6>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- DEFAULT ADDRESS -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="gold-text mb-0">Default Delivery Address</h5>
                    <a href="#" class="btn btn-gold btn-sm">
                        + Add / Change
                    </a>
                </div>

                <!-- {% if default_address %} -->
                <div class="address-box">
                    <h6 class="mb-1">Vignesh BR</h6>
                    <p class="mb-1">
                        22-17A, Nallanivillai
                        Pacode
                    </p>
                    <p class="mb-1">
                        Marthandam - 629 168
                    </p>
                    <p class="mb-0">
                        Tamil Nadu, India
                    </p>
                </div>
                <!-- {% else %}
                <p class="text-muted">No default address added yet.</p>
                {% endif %} -->

            </div>

        </div>
    </div>
</div>

</body>
</html>
